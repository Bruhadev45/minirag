name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # No `ruff format --check`: the 800-line budget forces compact
      # signatures that the formatter would expand past it.
      - name: Lint (src, tests, extras)
        run: ruff check src tests extras
      # pyproject's addopts carry the coverage floor (--cov-fail-under).
      - name: Tests + coverage floor + line budget
        run: pytest
