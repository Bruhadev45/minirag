[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minirag"
version = "0.1.0"
description = "A complete RAG retrieval engine in under 800 lines. No frameworks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kandimalla Bruhadev" }]
keywords = ["rag", "retrieval", "bm25", "search", "hybrid-search", "teaching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# Optional: learned embeddings for extras/embed.py (Apache-2.0; pulls in torch).
# 6.0 stopped trusting classes named by a local model directory without
# trust_remote_code (5.x trusted them); the API was checked against 6.2.0 source.
embeddings = ["sentence-transformers>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/minirag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor: measured 99% on 2026-10-10; 95 leaves room for honest
# branches without letting the number drift unnoticed.
addopts = "-q --cov=minirag --cov-report=term-missing --cov-fail-under=95"
# `extras/` lives outside the package (and outside the line budget), so put
# the repo root on the path for tests/test_hnsw.py.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `extras/` and `examples/` are ours too; they just live outside the package.
known-first-party = ["examples", "extras", "minirag"]
